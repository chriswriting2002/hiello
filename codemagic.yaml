# Builds Hiello for iPhone on Codemagic's Macs and uploads it to TestFlight.
# Uses the same App Store Connect API key as the Paper Meadow games.
# In Codemagic: add this repo as a new app, then make sure the key under
# Team settings > Integrations > Developer Portal is named "PaperMeadow" (or change the name below).
workflows:
  ios-hiello:
    name: Hiello for iPhone
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PaperMeadow
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hiello.family
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install
        script: npm install
      - name: Create the iPhone project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: App icon and launch screen
        script: npx capacitor-assets generate --ios --iconBackgroundColor '#14285A' --splashBackgroundColor '#34302D'
      - name: iPhone only, portrait only, app settings
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Lets you pick photos and videos to send to your family.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Lets you take a photo or video to send to your family.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Records sound for the videos you send to your family.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Hiello'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Hiello'" "$PLIST"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.hiello.family;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/App/Podfile
      - name: Copy the app in
        script: npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" || {
            echo ""
            echo "================ THE REAL XCODE ERROR (copy from here) ================"
            grep -h -B2 -A4 -E "error:|error \(|\*\* ARCHIVE FAILED|fatal" /tmp/xcodebuild_logs/*.log | grep -v "^--$" | head -80
            echo "================ (to here) ================"
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  ios-hiello-widget:
    name: Hiello for iPhone + Widget
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PaperMeadow
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hiello.family
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install
        script: npm install
      - name: Create the iPhone project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: App icon and launch screen
        script: npx capacitor-assets generate --ios --iconBackgroundColor '#14285A' --splashBackgroundColor '#34302D'
      - name: iPhone only, portrait only, app settings
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Lets you pick photos and videos to send to your family.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Lets you take a photo or video to send to your family.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Records sound for the videos you send to your family.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Hiello'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Hiello'" "$PLIST"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = com.hiello.family;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/App/Podfile
      - name: Add the home screen widget
        script: |
          set -e
          # the app's widget bridge, its screen, and the shared App Group
          cp native/ios/App/HielloWidgetPlugin.swift native/ios/App/HielloViewController.swift native/ios/App/App.entitlements ios/App/App/
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="HielloViewController" customModule="App" customModuleProvider="target"/' ios/App/App/Base.lproj/Main.storyboard
          grep -q HielloViewController ios/App/App/Base.lproj/Main.storyboard || { echo "Main.storyboard was not updated"; exit 1; }
          # the widget itself
          mkdir -p ios/App/HielloWidget && cp native/ios/HielloWidget/* ios/App/HielloWidget/
          # tapping the widget opens the app at that Hiello: hiello://post/<id>
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.hiello.family" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string hiello" "$PLIST"
          # add the widget target to the Xcode project (xcodeproj comes with CocoaPods)
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby scripts/add_widget.rb
      - name: Add the free app icon choices
        script: |
          set -e
          cp native/ios/App/icons/*.png ios/App/App/
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$PLIST"
          for N in Graphite Pink Cream; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$N dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$N:CFBundleIconFiles array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$N:CFBundleIconFiles:0 string Icon$N" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$N:UIPrerenderedIcon bool false" "$PLIST"
          done
          ruby scripts/add_icons.rb
      - name: Add photo notifications
        script: |
          set -e
          # the piece that puts the photo inside each notification, and the token hand-off in AppDelegate
          mkdir -p ios/App/HielloNotify && cp native/ios/HielloNotify/* ios/App/HielloNotify/
          ruby scripts/add_notify.rb
          grep -q capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift || { echo "AppDelegate was not updated"; exit 1; }
      - name: Copy the app in
        script: npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          # widget builds count from 1000 so they never collide with the plain workflow's numbers
          agvtool new-version -all $((BUILD_NUMBER + 1000))
      - name: Build
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" || {
            echo ""
            echo "================ THE REAL XCODE ERROR (copy from here) ================"
            grep -h -B2 -A4 -E "error:|error \(|\*\* ARCHIVE FAILED|fatal" /tmp/xcodebuild_logs/*.log | grep -v "^--$" | head -80
            echo "================ (to here) ================"
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
